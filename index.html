<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ttb reserve - Dynamic MC Teleprompter</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #f1f5f9;
            overscroll-behavior-y: none;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .disable-scroll { overflow: hidden !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const ChevronRight = ({ size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;

        const Mic = ({ size = 24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>;
        const UserIcon = ({ size = 24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
        const Settings = ({ size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
        const CheckCircle2 = ({ size = 24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>;
        const PenTool = ({ size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"></path><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="m2 2 7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>;
        const Eraser = ({ size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7"></path><path d="m5 11 9 9"></path></svg>;

        // --- Script Generator Logic ---
        const generateScript = (d) => [
          {
            id: 1,
            time: "13:15 น.",
            title: "กล่าวเปิดงาน (Opening & Agenda)",
            action: "(MC ทั้งสองคนเดินขึ้นเวที ยิ้มแย้ม ทอดสายตามองผู้ฟัง)",
            dialogues: [
              { speaker: "male", text: `สวัสดีแขกผู้มีเกียรติและลูกค้า ttb reserve ทุกท่านครับ ผม ${d.mcMaleFirstName} ${d.mcMaleLastName} รับหน้าที่เป็นผู้ดำเนินรายการร่วมในวันนี้ครับ` },
              { speaker: "female", text: `และดิฉัน ${d.mcFemaleFirstName} ${d.mcFemaleLastName} ค่ะ ขอต้อนรับทุกท่านเข้าสู่งานสัมมนาสุดเอ็กซ์คลูซีฟ Innovative Investment Solutions For Uncertain Climate “พลิกความผันผวน ด้วยนวัตกรรม และโซลูชันทางการเงิน”` },
              { speaker: "male", text: `ทุกท่านครับ... ในโลกการลงทุนปัจจุบันที่มีตัวแปรทางเศรษฐกิจซับซ้อนมากมาย จนทำให้ตลาดเกิดความผันผวนขั้นสุด แน่นอนครับว่า ในสถานการณ์เช่นนี้ คนที่จะสามารถสร้างผลตอบแทนได้ดีที่สุด จะต้องเป็น 'คนที่รู้ข้อมูลเร็วที่สุด และรู้ข้อมูลมากที่สุด'` },
              { speaker: "female", text: `และนั่นคือหัวใจสำคัญของงานในวันนี้ค่ะ ซึ่งในวันนี้ ทุกท่านจะได้พบกับ...` },
              { speaker: "male", text: `หัวข้อที่ 1 ‘Investment Outlook 2026’ โดย **${d.sp1Name}** **${d.sp1Title}** ที่จะมาเจาะลึกทิศทางเศรษฐกิจโลกและภาพรวมตลาด เพื่อให้ทุกท่านได้รู้ทันเทรนด์การลงทุนและเตรียมความพร้อมก่อนใคร` },
              { speaker: "female", text: `และต่อเนื่องด้วยหัวข้อที่ 2 ‘Innovative Investment Solutions For Uncertain Climate’ โดย **${d.sp2Name}** **${d.sp2Title}** ที่จะมาเผยถึงนวัตกรรมและโซลูชันทางการเงิน ที่จะช่วยปรับพอร์ตการลงทุนของทุกท่านให้สอดรับกับทุกเทรนด์ และพลิกความผันผวนให้กลายเป็นโอกาสค่ะ` },
              { speaker: "male", text: `และเพื่อเป็นการเริ่มต้นงานสัมมนาในวันนี้อย่างเป็นทางการ ผมขอเรียนเชิญ **${d.opName}** **${d.opTitle}** ขึ้นกล่าวเปิดงานและต้อนรับแขกผู้มีเกียรติทุกท่าน` },
              { speaker: "both", text: `ขอเสียงปรบมือด้วยครับ/ค่ะ` }
            ],
            note: `เมื่อพูดจบ เดินลงจากเวที รอจน${d.opName}กล่าวจบ`
          },
          {
            id: 2,
            time: "13:30 น.",
            title: "Session 1: Investment Outlook 2026",
            action: "(MC ทั้งคู่เดินกลับขึ้นเวทีด้วยรอยยิ้ม และใช้น้ำเสียงกระตือรือร้น)",
            dialogues: [
              { speaker: "male", text: `ขอขอบพระคุณ **${d.opName}** เป็นอย่างสูงครับ ที่ให้เกียรติมากล่าวเปิดงานและต้อนรับแขกผู้มีเกียรติทุกท่านอย่างอบอุ่นในวันนี้ครับ` },
              { speaker: "female", text: `และตอนนี้ค่ะ ก็ถึงเวลาที่เราจะมาก้าวให้ทันโลก ก้าวให้เร็วกว่าตลาด กับหัวข้อแรกของเราในวันนี้ อย่างที่น้อง${d.mcMaleNickname}ได้เรียนไปตอนต้นว่า 'การรู้ข้อมูลก่อน คือความได้เปรียบ' เราจะมาเจาะลึกภาพรวมเศรษฐกิจและไฮไลต์สำคัญที่นักลงทุนต้องจับตามอง` },
              { speaker: "male", text: `ขอเชิญทุกท่านพบกับ ผู้เชี่ยวชาญของเรา... ขอเสียงปรบมือต้อนรับ **${d.sp1Name}** ครับ` }
            ],
            note: "เมื่อพูดจบ เดินลงจากเวที ให้พื้นที่วิทยากรในการบรรยาย"
          },
          {
            id: 3,
            time: "14:00 น.",
            title: "Session 2: Innovative Investment Solutions",
            action: "(MC ทั้งคู่เดินขึ้นเวทีหลังจาก Session 1 จบลง พยักหน้าเล็กน้อยเพื่อแสดงความเห็นด้วยกับข้อมูลที่เพิ่งจบไป)",
            dialogues: [
              { speaker: "female", text: `ขอขอบพระคุณ **${d.sp1Name}** สำหรับข้อมูลที่อัดแน่นและวิสัยทัศน์ที่เฉียบคมมากๆ ค่ะ` },
              { speaker: "male", text: `ทุกท่านครับ... เราได้เห็นภาพรวมและทิศทางของตลาดกันไปแล้ว จะเห็นได้ชัดเจนเลยว่าความท้าทายและความผันผวนยังคงรออยู่ แต่ในทุกความท้าทาย ย่อมมี 'โอกาส' ซ่อนอยู่เสมอครับ` },
              { speaker: "female", text: `ลำดับต่อไป เราจะมาเจาะลึกถึงกุญแจสำคัญของงานในวันนี้ นั่นก็คือ 'นวัตกรรม' และโซลูชันทางการเงินจาก ttb ที่ถูกออกแบบมาเพื่อปกป้องและต่อยอดความมั่งคั่งของทุกท่านโดยเฉพาะ นวัตกรรมตัวนี้จะทำงานอย่างไร` },
              { speaker: "male", text: `ขอเสียงปรบมือต้อนรับ **${d.sp2Name}** **${d.sp2Title}** ครับ` }
            ],
            note: "เมื่อพูดจบ เดินลงจากเวที รอจนการบรรยายจบ"
          },
          {
            id: 4,
            time: "15:30 น.",
            title: "สรุปจบงาน & Private Consultation",
            action: "(MC ทั้งคู่เดินขึ้นเวทีเป็นครั้งสุดท้าย ยิ้มแย้ม และใช้น้ำเสียงที่เป็นกันเองมากขึ้น)",
            dialogues: [
              { speaker: "male", text: `ขอขอบพระคุณ **${d.sp2Name}** เป็นอย่างสูงครับ` },
              { speaker: "female", text: `เชื่อว่าในเวลานี้ ทุกท่านน่าจะได้เห็นถึงศักยภาพของโซลูชันทางการเงิน ที่จะมาเป็นตัวช่วยสำคัญในการ 'พลิกความผันผวน' ให้กลายเป็นการเติบโตของความมั่งคั่งอย่างยั่งยืนกันแล้วนะคะ` },
              { speaker: "male", text: `สำหรับช่วงเวลาต่อจากนี้ไป จนถึงเวลา 16 นาฬิกา 30 นาที จะเป็นช่วงเวลาสุดเอ็กซ์คลูซีฟ สำหรับ Private Consultation ครับ แขกผู้มีเกียรติท่านใดที่มีคำถามเพิ่มเติม ทางเรามีทีม Wealth Manager และผู้เชี่ยวชาญด้านการลงทุน เตรียมพร้อมให้คำแนะนำแบบส่วนตัว บริเวณพื้นที่ด้านหลังได้เลยครับ` },
              { speaker: "female", text: `นอกจากนี้ ทางเราได้จัดเตรียมอาหารว่างและเครื่องดื่มสุดพิเศษไว้คอยบริการทุกท่านเป็นที่เรียบร้อยแล้วค่ะ สามารถเชิญรับประทานพร้อมพูดคุยแลกเปลี่ยนมุมมองกันได้ตามอัธยาศัยเลยค่ะ` },
              { speaker: "male", text: `สำหรับช่วงเวลาบนเวทีนี้ ผม ${d.mcMaleNickname} ครับ` },
              { speaker: "female", text: `และดิฉัน ${d.mcFemaleNickname} ค่ะ พร้อมทีมงาน ttb reserve ขอขอบพระคุณทุกท่านเป็นอย่างสูง ที่ให้เกียรติสละเวลามาร่วมงานสัมมนาในวันนี้` },
              { speaker: "both", text: `ขอให้ทุกท่านมีความสุขกับการลงทุน และเดินทางกลับโดยสวัสดิภาพ... สวัสดีครับ/ค่ะ` }
            ],
            note: "จบงาน เชิญแขกเข้าสู่พื้นที่ให้คำปรึกษา"
          }
        ];

        // --- Helper: Highlight Text ---
        const parseHighlightText = (text) => {
            const parts = text.split(/\*\*(.*?)\*\*/g);
            return parts.map((part, i) => {
                if (i % 2 === 1) { 
                    return <span key={i} className="bg-gradient-to-r from-amber-500/30 to-yellow-400/20 text-amber-300 font-bold px-3 py-1 md:px-4 md:py-2 rounded-lg border border-amber-500/50 mx-1 inline-block drop-shadow-md">{part}</span>;
                }
                return <React.Fragment key={i}>{part}</React.Fragment>;
            });
        }

        // --- Main App ---
        function App() {
          const [appMode, setAppMode] = useState("setup"); // "setup" | "prompter"
          
          // State สำหรับฟอร์ม (ตั้งค่า Default ตามภาพและคำขอ)
          const [formData, setFormData] = useState({
            mcMaleNickname: "อาร์ม",
            mcMaleFirstName: "อาร์ม",
            mcMaleLastName: "(นามสกุล)",
            mcFemaleNickname: "ปู",
            mcFemaleFirstName: "โศศิษฐา",
            mcFemaleLastName: "แซ่แดง",
            opName: "คุณจักรพันธ์ จารุธีรศานต์",
            opTitle: "หัวหน้าบริหารเครือข่ายสาขา ทีทีบี",
            sp1Name: "คุณธนทัต ศรีชัยยงพานิช",
            sp1Title: "ที่ปรึกษาด้านการลงทุนและความคุ้มครอง ทีทีบี",
            sp2Name: "คุณชวมนต์ วินิจตรงจิตร",
            sp2Title: "รองประธานเจ้าหน้าที่บริหาร หัวหน้ากลุ่มลูกค้า ธนบดีธนกิจ, ttb"
          });

          // State สำหรับ Teleprompter
          const [currentStep, setCurrentStep] = useState(0);
          const [currentTime, setCurrentTime] = useState("");
          const [role, setRole] = useState("all"); 
          
          // Canvas/Drawing State
          const [isDrawingMode, setIsDrawingMode] = useState(false);
          const [lines, setLines] = useState({}); 
          const canvasRef = useRef(null);
          const mainRef = useRef(null);
          const isDrawing = useRef(false);

          // อัปเดตนาฬิกา
          useEffect(() => {
            const timer = setInterval(() => {
              const now = new Date();
              setCurrentTime(now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }));
            }, 1000);
            return () => clearInterval(timer);
          }, []);

          // Redraw Canvas เมื่อเปลี่ยนหน้า
          useEffect(() => {
            if (appMode !== 'prompter') return;
            const canvas = canvasRef.current;
            const mainContent = mainRef.current;
            if (!canvas || !mainContent) return;

            canvas.width = mainContent.scrollWidth;
            canvas.height = mainContent.scrollHeight;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
             
            const currentLines = lines[currentStep] || [];
            currentLines.forEach(line => {
                ctx.beginPath();
                ctx.strokeStyle = '#ef4444'; 
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                line.points.forEach((point, i) => {
                    if (i === 0) ctx.moveTo(point.x, point.y);
                    else ctx.lineTo(point.x, point.y);
                });
                ctx.stroke();
            });
          }, [currentStep, lines, isDrawingMode, appMode]);

          const getCoordinates = (e) => {
             const canvas = canvasRef.current;
             const rect = canvas.getBoundingClientRect();
             const clientX = e.touches ? e.touches[0].clientX : e.clientX;
             const clientY = e.touches ? e.touches[0].clientY : e.clientY;
             return {
                 x: clientX - rect.left + mainRef.current.scrollLeft,
                 y: clientY - rect.top + mainRef.current.scrollTop
             };
          };

          const startDrawing = (e) => {
              if (!isDrawingMode) return;
              e.preventDefault();
              isDrawing.current = true;
              const coords = getCoordinates(e);
              setLines(prev => {
                  const currentLines = prev[currentStep] || [];
                  return { ...prev, [currentStep]: [...currentLines, { points: [coords] }] };
              });
          };

          const draw = (e) => {
              if (!isDrawing.current || !isDrawingMode) return;
              e.preventDefault();
              const coords = getCoordinates(e);
              setLines(prev => {
                  const currentLines = [...(prev[currentStep] || [])];
                  if(currentLines.length === 0) return prev;
                  const lastLine = currentLines[currentLines.length - 1];
                  lastLine.points.push(coords);
                  return { ...prev, [currentStep]: currentLines };
              });
          };

          const stopDrawing = () => { isDrawing.current = false; };
          const clearDrawing = () => { setLines(prev => ({ ...prev, [currentStep]: [] })); };

          const handleChange = (e) => {
              const { name, value } = e.target;
              setFormData(prev => ({ ...prev, [name]: value }));
          };

          const startPrompter = (e) => {
              e.preventDefault();
              setAppMode('prompter');
              window.scrollTo(0,0);
          };

          // --- VIEW: SETUP FORM ---
          if (appMode === "setup") {
              return (
                  <div className="min-h-screen bg-slate-950 p-6 md:p-12 flex justify-center items-start">
                      <div className="w-full max-w-4xl bg-slate-900 rounded-2xl border border-slate-800 p-8 shadow-2xl">
                          <div className="flex items-center gap-4 mb-8 pb-6 border-b border-slate-800">
                              <Settings size={32} className="text-amber-500" />
                              <div>
                                  <h1 className="text-2xl font-bold text-white">ตั้งค่ารายชื่อสำหรับสคริปต์</h1>
                                  <p className="text-slate-400 text-sm">ข้อมูลที่คุณกรอกจะถูกนำไปสร้างเป็นสคริปต์อัตโนมัติ (แก้ไขได้ตลอดเวลา)</p>
                              </div>
                          </div>

                          <form onSubmit={startPrompter} className="space-y-8">
                              {/* MC Section */}
                              <div className="bg-slate-800/50 p-6 rounded-xl border border-slate-700/50">
                                  <h2 className="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2"><Mic size={18}/> ข้อมูลพิธีกร (MC)</h2>
                                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                      <div className="md:col-span-3 text-cyan-400 font-semibold border-b border-slate-700 pb-2">MC ชาย</div>
                                      <div>
                                          <label className="block text-sm text-slate-400 mb-1">ชื่อเล่น</label>
                                          <input type="text" name="mcMaleNickname" value={formData.mcMaleNickname} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                      </div>
                                      <div>
                                          <label className="block text-sm text-slate-400 mb-1">ชื่อจริง</label>
                                          <input type="text" name="mcMaleFirstName" value={formData.mcMaleFirstName} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                      </div>
                                      <div>
                                          <label className="block text-sm text-slate-400 mb-1">นามสกุล</label>
                                          <input type="text" name="mcMaleLastName" value={formData.mcMaleLastName} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                      </div>
                                  </div>
                                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                      <div className="md:col-span-3 text-pink-400 font-semibold border-b border-slate-700 pb-2">MC หญิง</div>
                                      <div>
                                          <label className="block text-sm text-slate-400 mb-1">ชื่อเล่น</label>
                                          <input type="text" name="mcFemaleNickname" value={formData.mcFemaleNickname} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                      </div>
                                      <div>
                                          <label className="block text-sm text-slate-400 mb-1">ชื่อจริง</label>
                                          <input type="text" name="mcFemaleFirstName" value={formData.mcFemaleFirstName} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                      </div>
                                      <div>
                                          <label className="block text-sm text-slate-400 mb-1">นามสกุล</label>
                                          <input type="text" name="mcFemaleLastName" value={formData.mcFemaleLastName} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                      </div>
                                  </div>
                              </div>

                              {/* Speakers Section */}
                              <div className="bg-slate-800/50 p-6 rounded-xl border border-slate-700/50">
                                  <h2 className="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2"><UserIcon size={18}/> ข้อมูลผู้บริหารและวิทยากร</h2>
                                  <div className="space-y-6">
                                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                          <div>
                                              <label className="block text-sm text-slate-400 mb-1">ชื่อ ผู้กล่าวเปิดงาน</label>
                                              <input type="text" name="opName" value={formData.opName} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                          </div>
                                          <div>
                                              <label className="block text-sm text-slate-400 mb-1">ตำแหน่ง ผู้กล่าวเปิดงาน</label>
                                              <input type="text" name="opTitle" value={formData.opTitle} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                          </div>
                                      </div>
                                      <hr className="border-slate-700"/>
                                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                          <div>
                                              <label className="block text-sm text-slate-400 mb-1">ชื่อ วิทยากรท่านที่ 1</label>
                                              <input type="text" name="sp1Name" value={formData.sp1Name} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                          </div>
                                          <div>
                                              <label className="block text-sm text-slate-400 mb-1">ตำแหน่ง วิทยากรท่านที่ 1</label>
                                              <input type="text" name="sp1Title" value={formData.sp1Title} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                          </div>
                                      </div>
                                      <hr className="border-slate-700"/>
                                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                          <div>
                                              <label className="block text-sm text-slate-400 mb-1">ชื่อ วิทยากรท่านที่ 2</label>
                                              <input type="text" name="sp2Name" value={formData.sp2Name} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                          </div>
                                          <div>
                                              <label className="block text-sm text-slate-400 mb-1">ตำแหน่ง วิทยากรท่านที่ 2</label>
                                              <input type="text" name="sp2Title" value={formData.sp2Title} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white focus:border-amber-500 focus:outline-none" required />
                                          </div>
                                      </div>
                                  </div>
                              </div>

                              <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl text-lg shadow-lg shadow-amber-900/50 transition-all active:scale-95 flex justify-center items-center gap-2">
                                  สร้างหน้าจอ Teleprompter <ChevronRight size={20}/>
                              </button>
                          </form>
                      </div>
                  </div>
              );
          }

          // --- VIEW: TELEPROMPTER ---
          const scriptData = generateScript(formData);
          const currentScript = scriptData[currentStep];

          const getDialogStyle = (speaker) => {
              if (role === "all") return "opacity-100";
              if (speaker === "both") return "opacity-100 ring-2 ring-amber-500/50 bg-amber-900/10 p-4 md:p-6 rounded-2xl";
              if (role === speaker) return "opacity-100 scale-[1.02] transform transition-all";
              return "opacity-30 grayscale blur-[0.5px] pointer-events-none"; 
          };

          const getSpeakerLabel = (speaker) => {
              if (speaker === "male") return <span className="text-cyan-400 font-bold bg-cyan-900/30 px-4 py-2 rounded-full text-base md:text-xl lg:text-2xl">MC {formData.mcMaleNickname}</span>;
              if (speaker === "female") return <span className="text-pink-400 font-bold bg-pink-900/30 px-4 py-2 rounded-full text-base md:text-xl lg:text-2xl">MC {formData.mcFemaleNickname}</span>;
              if (speaker === "both") return <span className="text-amber-400 font-bold bg-amber-900/30 px-4 py-2 rounded-full text-base md:text-xl lg:text-2xl">พูดพร้อมกัน</span>;
          }

          return (
            <div className="min-h-screen flex flex-col md:flex-row">
              {/* Sidebar */}
              <div className="w-full md:w-1/4 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 p-6 flex flex-col z-20">
                <div className="mb-6 flex justify-between items-start">
                  <div>
                    <h1 className="text-2xl md:text-3xl font-bold text-amber-500 tracking-wider">ttb reserve</h1>
                    <p className="text-sm text-slate-400 mt-1 uppercase tracking-widest">Dual MC Teleprompter</p>
                  </div>
                  <button onClick={() => setAppMode('setup')} className="bg-slate-800 p-3 rounded-lg text-slate-400 hover:text-white" title="กลับไปแก้รายชื่อ">
                      <Settings size={24} />
                  </button>
                </div>

                {/* Role Selector */}
                <div className="mb-8 bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <p className="text-sm text-slate-500 text-center mb-3 font-semibold tracking-wider">เลือกบทบาท (SELECT ROLE)</p>
                    <div className="flex flex-col gap-3">
                        <button onClick={() => setRole('male')} className={`py-3 px-4 rounded-lg text-base md:text-lg font-bold transition-all ${role === 'male' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-900/50' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                            🎙️ {formData.mcMaleNickname} (ชาย)
                        </button>
                        <button onClick={() => setRole('female')} className={`py-3 px-4 rounded-lg text-base md:text-lg font-bold transition-all ${role === 'female' ? 'bg-pink-600 text-white shadow-lg shadow-pink-900/50' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                            🎙️ {formData.mcFemaleNickname} (หญิง)
                        </button>
                        <button onClick={() => setRole('all')} className={`py-3 px-4 rounded-lg text-base md:text-lg font-bold transition-all ${role === 'all' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                            👁️ ดูสคริปต์ทั้งหมด
                        </button>
                    </div>
                </div>

                <div className="flex-grow hidden md:block overflow-y-auto">
                  <h2 className="text-base font-semibold text-slate-500 uppercase mb-4 tracking-wider">Run Cue</h2>
                  <div className="space-y-4">
                    {scriptData.map((step, index) => (
                      <div key={step.id} onClick={() => { setCurrentStep(index); if(mainRef.current) mainRef.current.scrollTo(0,0); }} className={`cursor-pointer p-4 rounded-xl transition-all duration-300 border ${currentStep === index ? 'bg-amber-500/10 border-amber-500/50 text-amber-400' : 'bg-slate-800/50 border-transparent text-slate-400 hover:bg-slate-800'}`}>
                        <div className="flex items-center gap-2 mb-2"><Clock size={16} /><span className="text-sm font-mono">{step.time}</span></div>
                        <div className="font-medium text-base lg:text-lg leading-tight">{step.title}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="mt-auto hidden md:block bg-slate-950 rounded-xl p-6 text-center border border-slate-800">
                  <div className="text-sm text-slate-500 mb-2">Current Time</div>
                  <div className="text-4xl lg:text-5xl font-mono text-white font-light tracking-widest">{currentTime || "00:00"}</div>
                </div>
              </div>

              {/* Main Content Area */}
              <div className="w-full md:w-3/4 flex flex-col h-screen overflow-hidden relative">
                
                {/* Header Area */}
                <header className="bg-slate-900/90 backdrop-blur-md p-6 md:p-8 border-b border-slate-800 flex justify-between items-center z-30 sticky top-0">
                  <div>
                    <div className="text-amber-500 font-mono text-sm md:text-base flex items-center gap-2 mb-2"><Clock size={18} /> {currentScript.time}</div>
                    <h2 className="text-2xl md:text-3xl lg:text-4xl font-bold text-white">{currentScript.title}</h2>
                  </div>
                  
                  {/* Drawing Tools */}
                  <div className="flex items-center gap-4">
                    {isDrawingMode && (
                       <button onClick={clearDrawing} className="p-3 md:px-5 md:py-3 bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 flex items-center gap-2 text-base md:text-lg border border-slate-700 transition-all">
                           <Eraser size={24} /> <span className="hidden md:inline">ลบหมึก</span>
                       </button>
                    )}
                    <button onClick={() => setIsDrawingMode(!isDrawingMode)} className={`p-4 md:px-6 md:py-3 rounded-lg flex items-center gap-2 text-base md:text-lg font-bold border transition-all ${isDrawingMode ? 'bg-red-500/20 text-red-400 border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`}>
                        <PenTool size={24} /> <span className="hidden md:inline">{isDrawingMode ? 'ปิดโหมดปากกา (เพื่อเลื่อนจอ)' : 'เปิดโหมดปากกา (จดโน้ต)'}</span>
                    </button>
                  </div>
                </header>

                {/* Script Content */}
                <main ref={mainRef} className={`flex-grow overflow-y-auto p-6 md:p-12 lg:p-16 pb-48 scroll-smooth relative ${isDrawingMode ? 'disable-scroll' : ''}`}>
                  <div className="max-w-5xl mx-auto relative z-10">
                    
                    <div className="bg-blue-900/20 border-l-4 border-blue-500 p-6 md:p-8 rounded-r-2xl mb-10 flex items-start gap-5">
                      <UserIcon className="text-blue-400 shrink-0 mt-1 md:mt-2" size={32} />
                      <div>
                        <span className="block text-blue-400 font-bold text-sm md:text-base uppercase mb-2">Action / ท่าทาง</span>
                        <span className="text-blue-100 text-xl md:text-2xl lg:text-3xl italic leading-relaxed">{currentScript.action}</span>
                      </div>
                    </div>

                    <div className="space-y-12">
                      {currentScript.dialogues.map((dialogue, idx) => (
                        <div key={idx} className={`flex flex-col gap-4 transition-all duration-500 ${getDialogStyle(dialogue.speaker)}`}>
                          <div>{getSpeakerLabel(dialogue.speaker)}</div>
                          <div className="flex gap-4 items-start pl-4 border-l-4 border-slate-800 ml-4 md:ml-6">
                            <Mic className={`shrink-0 mt-2 opacity-40 ${dialogue.speaker === 'male' ? 'text-cyan-500' : dialogue.speaker === 'female' ? 'text-pink-500' : 'text-amber-500'}`} size={36} />
                            <p className="text-3xl md:text-4xl lg:text-5xl text-white leading-[1.6] md:leading-[1.7] lg:leading-[1.8] font-light tracking-wide">
                                {parseHighlightText(dialogue.text)}
                            </p>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="mt-20 bg-slate-800/50 border border-slate-700 p-8 md:p-10 rounded-2xl flex items-center gap-6">
                       <CheckCircle2 className="text-emerald-400 shrink-0" size={40} />
                       <p className="text-emerald-300 text-xl md:text-2xl lg:text-3xl">{currentScript.note}</p>
                    </div>
                  </div>

                  {/* Canvas Overlay */}
                  <canvas ref={canvasRef} className="absolute top-0 left-0 z-20" style={{ pointerEvents: isDrawingMode ? 'auto' : 'none', cursor: isDrawingMode ? 'crosshair' : 'default' }} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} />
                </main>

                {/* Footer Controls */}
                <footer className="bg-slate-900 border-t border-slate-800 p-6 md:p-8 sticky bottom-0 z-30">
                  <div className="max-w-5xl mx-auto flex justify-between items-center gap-6">
                    <button onClick={() => { if(currentStep > 0) { setCurrentStep(currentStep-1); if(mainRef.current) mainRef.current.scrollTo(0,0); } }} disabled={currentStep === 0} className={`flex-1 md:flex-none flex items-center justify-center gap-3 px-8 py-5 md:py-6 rounded-2xl font-bold text-xl md:text-2xl transition-all ${currentStep === 0 ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-800 text-white hover:bg-slate-700 active:scale-95'}`}>
                      <ChevronLeft size={32} /> <span className="hidden md:inline">ย้อนกลับ</span>
                    </button>
                    <div className="md:hidden flex gap-3">
                      {scriptData.map((_, idx) => <div key={idx} className={`h-3 w-3 rounded-full ${currentStep === idx ? 'bg-amber-500' : 'bg-slate-700'}`} />)}
                    </div> 
                    <button onClick={() => { if(currentStep < scriptData.length - 1) { setCurrentStep(currentStep+1); if(mainRef.current) mainRef.current.scrollTo(0,0); } }} disabled={currentStep === scriptData.length - 1} className={`flex-1 md:flex-none flex items-center justify-center gap-3 px-10 py-5 md:py-6 rounded-2xl font-bold text-xl md:text-2xl transition-all ${currentStep === scriptData.length - 1 ? 'bg-slate-800 text-slate-600 cursor-not-allowed' : 'bg-amber-600 text-white hover:bg-amber-500 shadow-lg shadow-amber-900/50 active:scale-95'}`}>
                      <span className="hidden md:inline">คิวต่อไป</span> <span className="md:hidden">Next</span> <ChevronRight size={32} />
                    </button>
                  </div>
                </footer>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
