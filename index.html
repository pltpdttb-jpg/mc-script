            id: 3,
            time: "14:00 น.",
            title: "Session 2: Innovative Investment Solutions",

            dialogues: [
              { speaker: "kook", text: "ขอขอบพระคุณ **คุณธนทัต ศรีชัยยงพานิช** สำหรับข้อมูลที่อัดแน่นและวิสัยทัศน์ที่เฉียบคมมากๆ ค่ะ" },
              { speaker: "arm", text: "ทุกท่านครับ... เราได้เห็นภาพรวมและทิศทางของตลาดกันไปแล้ว จะเห็นได้ชัดเจนเลยว่าความท้าทายและความผันผวนยังคงรออยู่ แต่ในทุกความท้าทาย ย่อมมี 'โอกาส' ซ่อนอยู่เสมอครับ" },
              { speaker: "kook", text: "ลำดับต่อไป เราจะมาเจาะลึกถึงกุญแจสำคัญของงานในวันนี้ นั่นก็คือ 'นวัตกรรม' และโซลูชันทางการเงินจาก ttb ที่ถูกออกแบบมาเพื่อปกป้องและต่อยอดความมั่งคั่งของทุกท่านโดยเฉพาะ นวัตกรรมตัวนี้จะทำงานอย่างไร" },

            ],

          {

            time: "15:30 น.",

            dialogues: [
              { speaker: "arm", text: "ขอขอบพระคุณ **คุณชวมนต์ วินิจตรงจิตร** เป็นอย่างสูงครับ" },
              { speaker: "kook", text: "เชื่อว่าในเวลานี้ ทุกท่านน่าจะได้เห็นถึงศักยภาพของโซลูชันทางการเงิน ที่จะมาเป็นตัวช่วยสำคัญในการ 'พลิกความผันผวน' ให้กลายเป็นการเติบโตของความมั่งคั่งอย่างยั่งยืนกันแล้วนะคะ" },
              { speaker: "arm", text: "สำหรับช่วงเวลาต่อจากนี้ไป จนถึงเวลา 16 นาฬิกา 30 นาที จะเป็นช่วงเวลาสุดเอ็กซ์คลูซีฟ สำหรับ Private Consultation ครับ แขกผู้มีเกียรติท่านใดที่มีคำถามเพิ่มเติม ทางเรามีทีม Wealth Manager และผู้เชี่ยวชาญด้านการลงทุน เตรียมพร้อมให้คำแนะนำแบบส่วนตัว บริเวณพื้นที่ด้านหลังได้เลยครับ" },
              { speaker: "kook", text: "นอกจากนี้ ทางเราได้จัดเตรียมอาหารว่างและเครื่องดื่มสุดพิเศษไว้คอยบริการทุกท่านเป็นที่เรียบร้อยแล้วค่ะ สามารถเชิญรับประทานพร้อมพูดคุยแลกเปลี่ยนมุมมองกันได้ตามอัธยาศัยเลยค่ะ" },
              { speaker: "arm", text: "สำหรับช่วงเวลาบนเวทีนี้ ผม อาร์ม ครับ" },
              { speaker: "kook", text: "และดิฉัน กุ๊ก ค่ะ พร้อมทีมงาน ttb reserve ขอขอบพระคุณทุกท่านเป็นอย่างสูง ที่ให้เกียรติสละเวลามาร่วมงานสัมมนาในวันนี้" },
              { speaker: "both", text: "ขอให้ทุกท่านมีความสุขกับการลงทุน และเดินทางกลับโดยสวัสดิภาพ... สวัสดีครับ/ค่ะ" }
            ],
            note: "จบงาน เชิญแขกเข้าสู่พื้นที่ให้คำปรึกษา"
          }
        ];

        // Helper สำหรับ Render Text Highlight (เน้นชื่อวิทยากร)
        const parseHighlightText = (text) => {
            const parts = text.split(/\*\*(.*?)\*\*/g);
            return parts.map((part, i) => {
                if (i % 2 === 1) { // ข้อความที่อยู่ใน **...**
                    return <span key={i} className="bg-gradient-to-r from-amber-500/30 to-yellow-400/20 text-amber-300 font-bold px-3 py-1 rounded-md border border-amber-500/50 mx-1 inline-block drop-shadow-md">{part}</span>;
                }
                return <React.Fragment key={i}>{part}</React.Fragment>;
            });
        }

        // --- Main App Component ---
        function App() {
          const [currentStep, setCurrentStep] = useState(0);
          const [currentTime, setCurrentTime] = useState("");
          const [role, setRole] = useState("all"); // "all", "arm", "kook"
          
          // Canvas/Drawing State
          const [isDrawingMode, setIsDrawingMode] = useState(false);
          const [lines, setLines] = useState({}); // { stepId: [ { points: [{x,y}] } ] }
          const canvasRef = useRef(null);
          const mainRef = useRef(null);
          const isDrawing = useRef(false);

          // อัปเดตนาฬิกา
          useEffect(() => {
            const timer = setInterval(() => {
              const now = new Date();
              setCurrentTime(now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }));
            }, 1000);
            return () => clearInterval(timer);
          }, []);

          // จัดการ Canvas Dimensions และ Redraw
          useEffect(() => {
            const canvas = canvasRef.current;
            const mainContent = mainRef.current;
            if (!canvas || !mainContent) return;

            // ให้ขนาด canvas เท่ากับ scrollHeight ของ main
            canvas.width = mainContent.scrollWidth;
            canvas.height = mainContent.scrollHeight;

            redrawCanvas();
          }, [currentStep, lines, isDrawingMode]);

          const redrawCanvas = () => {
             const canvas = canvasRef.current;
             if (!canvas) return;
             const ctx = canvas.getContext('2d');
             ctx.clearRect(0, 0, canvas.width, canvas.height);
             
             const currentLines = lines[currentStep] || [];
             currentLines.forEach(line => {
                ctx.beginPath();
                ctx.strokeStyle = '#ef4444'; // สีปากกา (แดง)
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                line.points.forEach((point, i) => {
                    if (i === 0) ctx.moveTo(point.x, point.y);
                    else ctx.lineTo(point.x, point.y);
                });
                ctx.stroke();
             });
          };

          // Mouse/Touch Events สำหรับการวาด
          const getCoordinates = (e) => {
             const canvas = canvasRef.current;
             const rect = canvas.getBoundingClientRect();
             const clientX = e.touches ? e.touches[0].clientX : e.clientX;
             const clientY = e.touches ? e.touches[0].clientY : e.clientY;
             return {
                 x: clientX - rect.left + mainRef.current.scrollLeft,
                 y: clientY - rect.top + mainRef.current.scrollTop
             };
          };

          const startDrawing = (e) => {
              if (!isDrawingMode) return;
              e.preventDefault();
              isDrawing.current = true;
              const coords = getCoordinates(e);
              
              setLines(prev => {
                  const currentLines = prev[currentStep] || [];
                  return { ...prev, [currentStep]: [...currentLines, { points: [coords] }] };
              });
          };

          const draw = (e) => {
              if (!isDrawing.current || !isDrawingMode) return;
              e.preventDefault();
              const coords = getCoordinates(e);
              
              setLines(prev => {
                  const currentLines = [...(prev[currentStep] || [])];
                  if(currentLines.length === 0) return prev;
                  const lastLine = currentLines[currentLines.length - 1];
                  lastLine.points.push(coords);
                  return { ...prev, [currentStep]: currentLines };
              });
          };

          const stopDrawing = () => {
              isDrawing.current = false;
          };

          const clearDrawing = () => {
              setLines(prev => ({ ...prev, [currentStep]: [] }));
          };

          // เปลี่ยนหน้าสคริปต์
          const handleNext = () => {
            if (currentStep < scriptData.length - 1) {
              setCurrentStep(currentStep + 1);
              if (mainRef.current) mainRef.current.scrollTo(0, 0);
            }
          };

          const handlePrev = () => {
            if (currentStep > 0) {
              setCurrentStep(currentStep - 1);
              if (mainRef.current) mainRef.current.scrollTo(0, 0);
            }
          };

          const currentScript = scriptData[currentStep];

          // เช็คสไตล์ตาม Role
          const getDialogStyle = (speaker) => {
              if (role === "all") return "opacity-100";
              if (speaker === "both") return "opacity-100 ring-2 ring-amber-500/50 bg-amber-900/10 p-4 rounded-xl";
              if (role === speaker) return "opacity-100 scale-[1.02] transform transition-all";
              return "opacity-30 grayscale blur-[0.5px] pointer-events-none"; // Dim ของคนอื่น
          };

          const getSpeakerLabel = (speaker) => {
              if (speaker === "arm") return <span className="text-cyan-400 font-bold bg-cyan-900/30 px-3 py-1 rounded-full text-sm">MC อาร์ม</span>;
              if (speaker === "kook") return <span className="text-pink-400 font-bold bg-pink-900/30 px-3 py-1 rounded-full text-sm">MC กุ๊ก</span>;
              if (speaker === "both") return <span className="text-amber-400 font-bold bg-amber-900/30 px-3 py-1 rounded-full text-sm">พูดพร้อมกัน (อาร์ม & กุ๊ก)</span>;
          }

          return (
            <div className="min-h-screen flex flex-col md:flex-row">
              {/* Sidebar / Timeline Navigation */}
              <div className="w-full md:w-1/4 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 p-6 flex flex-col z-20">
                <div className="mb-6">
                  <h1 className="text-xl font-bold text-amber-500 tracking-wider">ttb reserve</h1>
                  <p className="text-xs text-slate-400 mt-1 uppercase tracking-widest">Dual MC Teleprompter</p>
                </div>

                {/* Role Selector */}
                <div className="mb-8 bg-slate-950 p-2 rounded-xl border border-slate-800">
                    <p className="text-xs text-slate-500 text-center mb-2 font-semibold tracking-wider">เลือกบทบาท (SELECT ROLE)</p>
                    <div className="flex flex-col gap-2">
                        <button onClick={() => setRole('arm')} className={`py-2 px-4 rounded-lg text-sm font-bold transition-all ${role === 'arm' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-900/50' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                            🎙️ น้องอาร์ม (ชาย)
                        </button>
                        <button onClick={() => setRole('kook')} className={`py-2 px-4 rounded-lg text-sm font-bold transition-all ${role === 'kook' ? 'bg-pink-600 text-white shadow-lg shadow-pink-900/50' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                            🎙️ พี่กุ๊ก (หญิง)
                        </button>
                        <button onClick={() => setRole('all')} className={`py-2 px-4 rounded-lg text-sm font-bold transition-all ${role === 'all' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                            👁️ ดูสคริปต์ทั้งหมด
                        </button>
                    </div>
                </div>

                <div className="flex-grow hidden md:block overflow-y-auto">
                  <h2 className="text-sm font-semibold text-slate-500 uppercase mb-4 tracking-wider">Run Cue</h2>
                  <div className="space-y-3">
                    {scriptData.map((step, index) => (
                      <div 
                        key={step.id}
                        onClick={() => setCurrentStep(index)}
                        className={`cursor-pointer p-3 rounded-xl transition-all duration-300 border ${
                          currentStep === index 
                            ? 'bg-amber-500/10 border-amber-500/50 text-amber-400' 
                            : 'bg-slate-800/50 border-transparent text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                        }`}
                      >
                        <div className="flex items-center gap-2 mb-1">
                          <Clock size={12} />
                          <span className="text-xs font-mono">{step.time}</span>
                        </div>
                        <div className="font-medium text-sm leading-tight">{step.title}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Real-time Clock for MC */}
                <div className="mt-auto hidden md:block bg-slate-950 rounded-xl p-4 text-center border border-slate-800">
                  <div className="text-xs text-slate-500 mb-1">Current Time</div>
                  <div className="text-3xl font-mono text-white font-light tracking-widest">{currentTime || "00:00"}</div>
                </div>
              </div>

              {/* Main Content Area */}
              <div className="w-full md:w-3/4 flex flex-col h-screen overflow-hidden relative">
                
                {/* Header Area */}
                <header className="bg-slate-900/90 backdrop-blur-md p-4 md:p-6 border-b border-slate-800 flex justify-between items-center z-30 sticky top-0">
                  <div>
                    <div className="text-amber-500 font-mono text-xs md:text-sm flex items-center gap-2 mb-1">
                      <Clock size={14} /> {currentScript.time}
                    </div>
                    <h2 className="text-xl md:text-2xl font-bold text-white">{currentScript.title}</h2>
                  </div>
                  
                  {/* Drawing Tools Toggle */}
                  <div className="flex items-center gap-3">
                    {isDrawingMode && (
                       <button onClick={clearDrawing} className="p-2 md:px-4 md:py-2 bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 flex items-center gap-2 text-sm border border-slate-700 transition-all">
                           <Eraser size={18} /> <span className="hidden md:inline">ลบหมึก</span>
                       </button>
                    )}
                    <button 
                        onClick={() => setIsDrawingMode(!isDrawingMode)} 
                        className={`p-3 md:px-5 md:py-2 rounded-lg flex items-center gap-2 text-sm font-bold border transition-all ${
                            isDrawingMode 
                            ? 'bg-red-500/20 text-red-400 border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.2)]' 
                            : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'
                        }`}
                    >
                        <PenTool size={18} /> 
                        <span className="hidden md:inline">{isDrawingMode ? 'ปิดโหมดปากกา (เพื่อเลื่อนจอ)' : 'เปิดโหมดปากกา (จดโน้ต)'}</span>
                    </button>
                  </div>
                </header>

                {/* Script Content (Scrollable) */}
                <main 
                    ref={mainRef}
                    className={`flex-grow overflow-y-auto p-4 md:p-10 pb-40 scroll-smooth relative ${isDrawingMode ? 'disable-scroll' : ''}`}
                >
                  <div className="max-w-4xl mx-auto relative z-10">
                    
                    {/* Action / Stage Direction */}
                    <div className="bg-blue-900/20 border-l-4 border-blue-500 p-4 md:p-6 rounded-r-xl mb-8 flex items-start gap-4">
                      <UserIcon className="text-blue-400 shrink-0 mt-1" size={24} />
                      <div>
                        <span className="block text-blue-400 font-bold text-xs md:text-sm uppercase mb-1">Action / ท่าทาง</span>
                        <span className="text-blue-100 text-base md:text-xl italic leading-relaxed">{currentScript.action}</span>
                      </div>
                    </div>

                    {/* Dialogues */}
                    <div className="space-y-8">
                      {currentScript.dialogues.map((dialogue, idx) => (
                        <div key={idx} className={`flex flex-col gap-2 transition-all duration-500 ${getDialogStyle(dialogue.speaker)}`}>
                          <div>{getSpeakerLabel(dialogue.speaker)}</div>
                          <div className="flex gap-4 items-start pl-2 border-l-2 border-slate-800 ml-2">
                            <Mic className={`shrink-0 mt-2 opacity-40 ${dialogue.speaker === 'arm' ? 'text-cyan-500' : dialogue.speaker === 'kook' ? 'text-pink-500' : 'text-amber-500'}`} size={24} />
                            <p className="text-2xl md:text-4xl text-white leading-[1.6] md:leading-[1.7] font-light tracking-wide">
                                {parseHighlightText(dialogue.text)}
                            </p>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Ending Note */}
                    <div className="mt-16 bg-slate-800/50 border border-slate-700 p-6 rounded-xl flex items-center gap-4">
                       <CheckCircle2 className="text-emerald-400 shrink-0" size={24} />
                       <p className="text-emerald-300 text-lg">{currentScript.note}</p>
                    </div>

                  </div>

                  {/* Canvas Overlay for Drawing */}
                  <canvas
                      ref={canvasRef}
                      className="absolute top-0 left-0 z-20"
                      style={{ 
                          pointerEvents: isDrawingMode ? 'auto' : 'none',
                          cursor: isDrawingMode ? 'crosshair' : 'default'
                      }}
                      onTouchStart={startDrawing}
                      onTouchMove={draw}
                      onTouchEnd={stopDrawing}
                      onMouseDown={startDrawing}
                      onMouseMove={draw}
                      onMouseUp={stopDrawing}
                      onMouseLeave={stopDrawing}
                  />
                </main>

                {/* Bottom Navigation Controls */}
                <footer className="bg-slate-900 border-t border-slate-800 p-4 md:p-6 sticky bottom-0 z-30">
                  <div className="max-w-4xl mx-auto flex justify-between items-center gap-4">
                    <button 
                      onClick={handlePrev}
                      disabled={currentStep === 0}
                      className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-4 rounded-xl font-bold text-lg transition-all ${
                        currentStep === 0 
                          ? 'bg-slate-800 text-slate-600 cursor-not-allowed' 
                          : 'bg-slate-800 text-white hover:bg-slate-700 active:scale-95'
                      }`}
                    >
                      <ChevronLeft size={24} /> <span className="hidden md:inline">ย้อนกลับ</span>
                    </button>

                    {/* Mobile Step Indicator */}
                    <div className="md:hidden flex gap-2">
                      {scriptData.map((_, idx) => (
                         <div key={idx} className={`h-2 w-2 rounded-full ${currentStep === idx ? 'bg-amber-500' : 'bg-slate-700'}`} />
                      ))}
                    </div> 

                    <button 
                      onClick={handleNext}
                      disabled={currentStep === scriptData.length - 1}
                      className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-8 py-4 rounded-xl font-bold text-lg transition-all ${
                        currentStep === scriptData.length - 1 
                          ? 'bg-slate-800 text-slate-600 cursor-not-allowed' 
                          : 'bg-amber-600 text-white hover:bg-amber-500 shadow-lg shadow-amber-900/50 active:scale-95'
                      }`}
                    >
                      <span className="hidden md:inline">คิวต่อไป</span> <span className="md:hidden">Next</span> <ChevronRight size={24} />
                    </button>
                  </div>
                </footer>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
